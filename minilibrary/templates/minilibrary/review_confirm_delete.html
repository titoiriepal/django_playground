
{% extends 'base.html' %}


{% block content %}

<h2>Confirm Delete Review</h2>

<p><strong>Are you sure you want to delete this review?</strong></p>
<p>Book: {{ review.book.title }}</p>
<p>{{ object.text }}</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'book_detail' review.book.id %}" class="btn btn-secondary">Cancel</a>
</form>
    
{% endblock content %}
